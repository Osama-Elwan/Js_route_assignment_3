<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark</title>
    <link rel="icon" href="./assets/images/8316803.png">
    <link href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
    <!-- fontawsome -->
    <link rel="stylesheet" href="./assets/css/all.min.css">
    <!-- bootstarp -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <!-- main styles  -->
    <link rel="stylesheet" href="./assets/css/style.css">

</head>
<body>

    <section class="main-card mt-5 py-5">
        <div class="container w-50  py-5">
            <h1>
                Bookmarker
            </h1>
            <form action="" class="my-4">
                <div class="input-content">
                    <label for="siteNameInput">
                        <i class="fa-solid fa-arrow-right me-2"></i>
                        Site Name
                    </label>
                    <input type="text" class="form-control my-3 " placeholder="Enter Site Name" id="siteNameInput"
                    oninput="validate(nameRegex,siteNameInput)">
                </div>
                <div class="input-content d-none special-input" id="inputContent">

                    <label for="siteUrlInput" class="">
                        <i class="fa-solid fa-link me-2"></i>
                        Site URL
                    </label>
                    <input type="text" class="form-control my-3 " placeholder="Enter Site URL" id="siteUrlInput"
                    oninput="validate(urlRegex,siteUrlInput)">
                </div>
                <button type="button" class="btn btn-secondary py-2 px-5 btn-special" id="nextButton" onclick="addSiteUrlInput()">Next</button>
                <button type="button" class="btn btn-secondary py-2 px-5 btn-special d-none" id="submitButton" onclick="addSite()">submit</button>
            </form>
            <table class="table table-dark" id="sitesTable">
                <thead>
                    <tr>
                    <th scope="col">Website</th>
                    <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="siteRows">

                </tbody>
                </table>
        </div>
    </section>












    <!-- sweet alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- bootstrap  -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <!-- main script -->
    <script src="./assets/js/main.js"></script>
</body>
</html>
